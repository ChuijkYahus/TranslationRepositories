[tips-and-tricks-item-description]
planet-crucible-briefing=[planet=crucible] is a dense planet without [entity=iron-ore], [entity=copper-ore], [entity=uranium-ore], [entity=stone], [fluid=water] or [entity=crude-oil], but all necessary items can be produced from [entity=planet-crucible-skarn] and [entity=planet-crucible-emulsion].\n[entity=solar-panel] is more effective. The environment is inhospitable but there are no natural hazards.\n[tile=planet-crucible-lava] isn't pumpable until later, and isn't landfillable until much later but it can be crossed by elevated rails.
planet-crucible-gravity=[img=utility/warning_icon]WARNING[img=utility/warning_icon] Due to the extreme gravity and atmospheric pressure of [planet=crucible], normal [item=rocket-fuel] is insufficient for reaching space.\nAfter landing on [planet=crucible], you will need to use [item=planet-crucible-science-pack] to research a way off the planet.
planet-crucible-metallic-hydrogen=Because of its high energy-density and low stability, [tooltip=metallic hydrogen,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum] is extremely hazardous and precautions are required when manufacturing it.\n[tooltip=Metallic hydrogen,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum] of all forms will explode if destroyed and cannot be recycled, but can safely be reprocessed in [entity=planet-crucible-pressure-forge]. They can also be safely disposed of in the void of space.\nThe [tooltip=least stable forms,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-unstable-enum] of metallic hydrogen will eventually explode on their own if not properly reprocessed or disposed of, and therefore cannot be stockpiled.
planet-crucible-metallic-hydrogen-enum=Metallic hydrogen:\n[item=planet-crucible-denatured-hydrogen] Denatured hydrogen\n[item=planet-crucible-denatured-hydrogen-critical] Denatured hydrogen (critical)\n[item=planet-crucible-hydrogen-plate] Hydrogen plate (stable)\n[item=planet-crucible-hydrogen-plate-activated] Hydrogen plate (active)\n[item=planet-crucible-hydrogen-plate-unstable] Hydrogen plate (unstable)\n[item=planet-crucible-hydrogen-plate-critical] Hydrogen plate (critical)\n[item=planet-crucible-lithium-hydride] Lithium hydride\n[item=planet-crucible-hydrogen-cable] Hydrogen filament
planet-crucible-metallic-hydrogen-unstable-enum=Least stable metallic hydrogen:\n[item=planet-crucible-denatured-hydrogen] Denatured hydrogen\n[item=planet-crucible-denatured-hydrogen-critical] Denatured hydrogen (critical)\n[item=planet-crucible-hydrogen-plate-activated] Hydrogen plate (active)\n[item=planet-crucible-hydrogen-plate-unstable] Hydrogen plate (unstable)\n[item=planet-crucible-hydrogen-plate-critical] Hydrogen plate (critical)
planet-crucible-space-platform=[img=utility/warning_icon]WARNING[img=utility/warning_icon] Due to the extreme gravity of [planet=crucible], space platforms need significant thrust to reach [space-location=crucible-orbit]. A space platform should only attempt the trip if it can sustain speeds well above __1__ km/s.\nThere are few asteroids near [planet=crucible], so you may need to use [item=planet-crucible-science-pack] to research alternative methods of obtaining necessary resources in space.