[string-mod-setting-description]
planet-crucible-vanilla-change-amount-all=Adds products from Crucible's production chains to most recipes unlocked on Aquilo. This is the way the mod is intended to be played, especially if added as a standalone planet; it may be less suited to playthroughs with many additional planets.
planet-crucible-vanilla-change-amount-no-recipes=Adds the high-pressure science pack to most technologies requiring all other inner-planet science packs.
planet-crucible-vanilla-change-amount-no-technologies=Adds the high-pressure science pack to the Promethium science pack and Research productivity technologies only.
planet-crucible-vanilla-change-amount-none=Makes no changes to existing recipes or technologies.

