[technology-description]
planet-discovery-crucible=A large, dense rocky world with crushing gravity and atmospheric pressure. Due to the intense gravity, building a rocket on [space-location=crucible] will require mastering the planet's resources. Opportunity abounds... if you can handle the pressure.
planet-crucible-kiln=A large furnace powered directly by heat. In addition to regular smelting, it can take fluid input, which is critical for processing [item=planet-crucible-skarn].
planet-crucible-emulsion-processing=Allows processing [fluid=planet-crucible-emulsion] into useful fluids, with the occasional [item=planet-crucible-diamond] in the rough.
planet-crucible-skarn-processing-adv=Unlocks the full potential of [item=planet-crucible-skarn].
planet-crucible-pressure-forge=A crafting facility for high-pressure processes.
planet-crucible-hydrogen-processing=Highly pressurized hydrogen has many useful properties, but it is wayward if mishandled.
planet-crucible-hydrogen-metallization=Create metallic hydrogen, the holy grail of high-pressure science.
planet-crucible-science-pack=More advanced high-pressure applications.
planet-crucible-rocket-part=Build a rocket capable of reaching [space-location=crucible] orbit.
planet-crucible-gem-synthesis=More efficient recipes for [item=planet-crucible-ruby] and [item=planet-crucible-diamond].
planet-crucible-thruster=Use metallic hydrogen to more easily escape [space-location=crucible]'s deep gravity well.
planet-crucible-military=Use metallic hydrogen to craft ammunition in space without asteroids.
planet-crucible-lithium-hydride=More efficient recipes for metallizing hydrogen.
planet-crucible-night-vision-mk2=A more compact [item=night-vision-equipment].
planet-crucible-personal-laser-mk2=A more powerful [item=personal-laser-defense-equipment].
planet-crucible-offshore-pump=An upgraded [entity=offshore-pump] capable of operating in the intense gravity of [space-location=crucible].
planet-crucible-optics=Advanced tools to focus and control light.
planet-crucible-laser=More advanced laser weaponry that requires a lens to focus the increased energy.
planet-crucible-lens-one=A focusing lens for [entity=planet-crucible-laser-turret] that deals impact damage.
planet-crucible-lens-two=A focusing lens for [entity=planet-crucible-laser-turret] that deals acid damage.
planet-crucible-lens-three=A focusing lens for [entity=planet-crucible-laser-turret] that deals fire damage.
planet-crucible-lens-four=A focusing lens for [entity=planet-crucible-laser-turret] that deals electric damage.
planet-crucible-lens-five=A focusing lens for [entity=planet-crucible-laser-turret] that deals poison damage.

