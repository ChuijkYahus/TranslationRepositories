[mod-setting-description]
carna-sciencesphere-mode=This mode completely changes Carna's progression to utilize Science Spheres!  In this mode, most of the technology tree is changed to require doing traditional research on Carna with new science spheres.  WARNING, this will drastically lengthen the progression tree on the planet by at least 3x.
carna-itemtemp=Several items will have "spoilage", or in another sense, will cool down from hot to cold.  A number of recipes rely on hot variants of the items in order to be crafted.  Will increase Carna's logistical difficulty significantly.  ENABLED by default.  This option is included to disable since Carna is already a rather complex logistical planet, some may find Carna's temperature items adding a little too much difficulty.
carna-complex-atmosphere=If toggled ON, the atmosphere of Carna will have a complex effect on machines.  With low heat pollution values, machines will be slowed down by 40%, at a higher value it will be slowed down by 20%, eventually 0, and with high value, will speed up by 10% on a per chunk basis.  If toggled OFF, machines will simply be slowed down by 20% if pollution is not high enough in the chunk.  Toggled ON may have an effect on UPS, this is not concrete tested.  It is recommended to not switch this on or off if you have already started or generated a world on Carna.
carna-atmosphere-check=How many seconds until Carna checks the local chunks on its surface to update temperature effects on entities or machines.  This check will be run once every determined amount of seconds.  Higher values mean that machine status on Carna will be updated less often, lower values mean more often.
carna-atmosphere=SIMPLE, the atmosphere of Carna will have a simple effect on machines.  Machines that are not heated by a tower will have a reduction in speed.\nCOMPLEX, the atmosphere of Carna will have a complex effect on machines.  With low heat pollution values, machines will be slowed down by 40%, at a higher value it will be slowed down by 20%, eventually 0, and with high value, will speed up by 10% on a per chunk basis.  If toggled OFF, machines will simply be slowed down by 20% if pollution is not high enough in the chunk.\nCOMPLEX OPTIMIZED, the same as complex, but rather than checking chunks as a 1x1, every chunk is checked as a 2x2 group, resulting in overall less precision, but less chance of nanolag once you get more of the surface used.  \nComplex may have an effect on UPS, this is not concrete tested.  It is extremely unrecommended to switch between modes if you have already started or generated a world on Carna.
carna-roamers-temp=If unticked, Carna's roaming bots will never automatically disappear.  Apparently they are capable drawing UPS, default is they are left to die on their own.  If you like the bots however and don't mind the UPS draw, you are free to keep them around.

