[technology-description]
planet-discovery-carna=A planet with very low temperatures, slowing down the processing speed of all machines.  We will need ways to heat the surrounding area.
carna-interm_1=Unlock ways to utilize the Carnan salvage scattered across the landscape, including rudimentary methods of utilizing and creating plasma chunks.
molybdenum-processing=Molybdenum is the only minable natural resource on this planet.  It would appear that most if not all natural resources have somehow been converted or transmuted into this material, making one wonder if this molybdenum is truly natural or not.  Gaining mass access to this resource is very important as we will be able to fully automate the creation of Molybdenum cores necessary for creating more advanced machines.
chunk-processing=Turning fluids into chunks, useful for a small number of things, such as creating steam.
carnalseiver=This structurue is capable of isolating and reconstructing atomic properties we're more familiar with, essentially converting the salvage on Carna into iron, copper, and even some molybdenum to help us along our way until we can gain a more mass access to its raw resource.
carnalairprocessing=Carna's atmosphere is filled water, despite having none on its surface.  The molybdenum air isolator is capable of using its Carnan sourced molybdenum core to isolate particles of our choosing in the air and creating a usable gas in its place.
geyser-power=There are a number of openings on the surface that are emitting gaseous fumes into the air, we can harness these gases in various ways such as to create steam or burn off into the air using another structure, the Molybdenum heating pillar.  This pillar will allow us to heat the surrounding area and allow our machines to operate at optimal speeds, essentially acting as a form of combatting Carna's harsh environment.
algite-processing=Algite is a special mineral found inside of Carna's machines, this rare resource can be isolated from the salvage that surrounds us by using special cores inside of our Molybdenum sieving machines.  This resource will be mandatory in creating powerful machinery we can use.
stromatolite-carnabreed=Materialization of a special breed of Gleba's iron and copper stromatolites, we can grow these fascinating sacks of metallic bacteria en-masse as a substitute to our usual ore veins.  Agriculture towers will be necessary.  In order for these stromatolites to grow, they will need growable soil to sit on, however Carna is a world practically devoid of life.  Carnan life capsules are our answer, throwing these grenades will yeild the creation of a cloud that will convert the area around it into a space suitable for specific plants we materialize on Carna.
carnal-oil2=Advanced method of obtaining oils using Carnan energy.
algite-assembler=A super fast assembling machine requiring Carnan plasma to run.  Is almost unusable offworld of Carna, there may be a better solution for offworld use.
carnal-science-pack=The source of Carnan knowledge in a bottle.
slipstack-carnabreed=The Carnan breed of Gleba's slipstacks.  This plant will specialize in yielding nutrient rich water which we can use to feed more advanced biochambers, a supply of fuel that does not expire.  Is also essential for the breeding of Exoticia.
boompuff-carnabreed=There is no coal on Carna, this plant will yield an equivilant that can be processed into carbon.
feron-processing=Processing of Carnan salvage clusters with special cores yields access to a super rare mineral, feron.  Feron will grant us access to Carnan energy as well as the ability to create advanced machinery we can use offworld.
automation-feron=Incredibly fast and powerful assembling machines that use Carnan energy as fuel.
biochamber-mk2=Upgraded version of the Biochamber that uses Richwater as a fuel source instead of raw nutrients.
artificial-global-gleba-soil=Our life capsules only work on Carna's surface, but these tiles can be placed anywhere, allowing us to grow our Carnan based breeds of plants on any surface we want.  This effectively grants us the ability to create carbon mines, iron and copper mines, and nutrient water anywhere we want.
carnal-energy-crystal=Physical form of Carnan energy, suitable for mass transport offworld.  Is also growable.
feron-airpump=A super advanced form of the Molybdenum air isolator.  This brilliant machine can isolate atoms in the air of many worlds in order to materialize the gas we desire.
forging-exotic-material=A complicated processes to breed and grow Exoticia, an enigmatic plant which will source exotic matter that we can use.  By launching rockets into the high atmosphere, gases from Carna's electromagnetic field can be collected and used to convert seeds into exotic seeds.
breeding-exoticia=Plants that yield exotic matter.
advanced-materialization=Materialize more complex resources at the expense of knowledge.
carna-reach-equipment=Extending your reach by 1 tile.
carna-craft-equipment=Increasing your crafting speed.
carna-cache-equipment=Enhancing your storage space.
carnan-spire=A large structure that is capable of transmitting energy sourced into it across an entire surface!  This machine is magnificent and efficiently distributes all manner of energy at a large expense of energy being supplied to it and a spire core.  This machine will remove all need to use local wiring, however should the machine stop burning a spire core, the transmission will be stalled.  It is recommended to keep all machines that are needed for running the spire hooked to a local power network should transmission stop.  Large amounts of energy will be needed to power the spire.
stingfrond-carnabreed=Stingfronds are necessary for the creation of other Carnan based plants.  The fruit cultivated by this plant is rich in oils.
algite-bio-dome=This special dome is capable of recreating a local atmosphere identical to Gleba, allowing the cultivation of fruits such as Yumako and Jellynut offworld.  Once the dome is placed, an option will be provided to create the local atmosphere at the expense of making the area the dome sits permanent.  There is no way to reverse this effect.

