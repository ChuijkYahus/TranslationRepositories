[mod-setting-description]
rigor-module-compatibility-mode=Compatibility mode requires recipes to be explicitly whitelisted by a mod in order to make use of rigor modules. It is recommended to only enable compatibility mode if this mod is causing compatibility issues with other mods.
rigor-module-compatibility-mode-include-vanilla=Should all eligible recipes from vanilla Factorio (including Space Age) be whitelisted in compatibility mode? Only applies if compatibility mode is enabled.
rigor-module-multiplayer-wait-ticks=This setting is currently unused.
rigor-module-disable-rigor-effect=[img=utility/warning_icon]WARNING[img=utility/warning_icon] Only use if you know what you are doing!\nThis setting should only be used to reconcile a savefile before removing this mod or before changing settings that would cause entities to disappear.

[tips-and-tricks-item-name]
rigor-module-mod-tip-1=Rigor
rigor-module-mod-tip-2=Rigor probabilities

[tips-and-tricks-item-description]
rigor-module-list=[item=rigor-module] Rigor module \n[item=rigor-module-2] Rigor module 2 \n[item=rigor-module-3] Rigor module 3
rigor-module-mod-tip-1=Rigor is a new module effect, provided by [tooltip=Rigor Modules,tips-and-tricks-item-description.rigor-module-list]. Rigor increases the odds a recipe will produce its most valuable output. Rigor can only affect a product with a probabilistic output, and can only affect a single product per recipe. Rigor also cannot affect recycling recipes, except for [recipe=scrap-recycling].
rigor-module-mod-tip-2=Rigor increases the odds of a recipe producing the given output.\nFor probability 'p', odds = 'p/(1-p)'.\nFor probability 'p' and rigor 'r', probability is scaled using the formula: 'rp/(rp - p + 1)'.

[tips-and-tricks-simulation]
rigor-module-mod-tip-2=Rigor calculation
initial-probability=Initial probability (odds)
with-rigor=+__1__% rigor
rigor-probability=__1__% (__2__)