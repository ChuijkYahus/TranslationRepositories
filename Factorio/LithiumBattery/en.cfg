[technology-description]
lithium-accumulator=Lithium accumulator with better capacity and input/output rate.
lithium-battery-mk4=Lithium battery give you the ability to craft a powerful personal battery MK4.
lithium-roboport-mk3=Roboport that can accommodate more robots and recharge them more quickly. Also increases the size of the construction area.
lithium-shield-mk3=The energy shield MK3 can absorb more damage.
hea-processing=The development of high-entropy alloy provides a new metal with high strength properties.
hea-engine=This advanced engine is cutting-edge technology. It has high resistance to heat and pressure, as well as impressive power.
automation-4=Latest generation assembling machine, capable of even higher production speeds.
hea-thruster=Unlock a powerfull high-entropy alloy thruster. This monster has 4x more power than a basic thruster, but also 10x the fuel needs.

