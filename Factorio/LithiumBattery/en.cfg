[mod-setting-description]
lithium-battery-fusion-generator=Only works if the endgame HEA is disabled, otherwise the recipe is changed automatically. Modifies the basic recipe by adding lithium batteries.
lithium-battery-fusion-reactor-equipment=Only works if the endgame HEA is disabled, otherwise the recipe is changed automatically. Modifies the basic recipe by adding lithium batteries.
lithium-battery-railgun=Only works if the endgame HEA is disabled, otherwise the recipe is changed automatically. Modifies the basic recipe by adding lithium batteries.
lithium-battery-railgun-turret=Only works if the endgame HEA is disabled, otherwise the recipe is changed automatically. Modifies the basic recipe by adding lithium batteries.
lithium-accumulator-quality=For both accumulator and lithium accumulator. Only work if lithium accumulator are activated
lithium-roboport-mk3-radius=A radius of 25 mean an area of 50x50
hea-endgame=Adds high-entropy alloy, a new production chain, recipe changes, and a reorganisation of technologies. All of this adds an extra layer of difficulty
hea-promethium=Replaces the quantum processor with a high-entropy alloy engine unit
hea-assembling-machine-4=Only works if the endgame HEA is enabled
hea-thruster=Only works if the endgame HEA is enabled
hea-belt=Only works if the endgame HEA is enabled. To use without the endgame HEA, Download the PromethiumBeltRebalance mod
hea-belt-speed=Only works if the endgame HEA is enabled.
hea-belt-tech-cost=Only works if the endgame HEA is enabled. If the endgame HEA is disabled and PromethiumBeltRebalance mod is enabled, the tech cost setting is set on the mod

