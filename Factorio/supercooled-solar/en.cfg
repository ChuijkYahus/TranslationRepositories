[mod-setting-name]
supercooled-solar=Enable cold solar matrix
supercooled-accumulator=Enable cold accumulator v2
supercooled-accumulator-multiplier=Accumulator v2 cold multiplier
supercooled-solar-multiplier=Solar matrix cold multiplier

[mod-setting-description]
supercooled-solar=Enable cold environment buffs on the solar matrix. Turn it off before removing the mod!
supercooled-accumulator=Enable cold environment buffs on accumulator v2. Turn it off before removing the mod!
supercooled-accumulator-multiplier=Multiplies the input/output and storage of accumulator v2 on cold planets
supercooled-solar-multiplier=Multiplies the power production of the solar matrix on cold planets