[mod-setting-name]
pre-heated-exchanger-crafting-mode=Exchanger crafting mode

[mod-setting-description]
pre-heated-exchanger-crafting-mode=[font=default-bold]Separated:[/font] keep both vanilla and Pre-Heated Exchanger crafting entries.\n[font=default-bold]Integrated:[/font] hide the vanilla Heat Exchanger recipe and place Pre-Heated Exchangers in water-to-500°C Heat Exchanger mode by default. Existing machines and inventory items are retained. If a modpack disables mode switching, Separated behavior is used instead.

