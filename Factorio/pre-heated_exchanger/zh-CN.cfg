[mod-setting-description]
pre-heated-exchanger-crafting-mode=[font=default-bold]分离：[/font]同时保留原版换热器和本模组预热器的配方。\n[font=default-bold]集成：[/font]隐藏原版换热器配方，放置预热器时默认设为水至500°C蒸汽的换热器模式。保留已有的机器和物品。模组包禁用模式切换时使用分离模式。

[string-mod-setting]
pre-heated-exchanger-crafting-mode-separated=分离
pre-heated-exchanger-crafting-mode-integrated=集成
