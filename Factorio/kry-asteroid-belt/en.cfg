[mod-setting-description]
kry-asteroid-belt-density=Multiplier for the probability of asteroids spawning in the asteroid belt. Min value is 0.0 (zero asteroids) and max value is 100.00 (many asteroids).
kry-kuiper-belt=Enables a secondary outer asteroid belt located between Aquilo and the Solar System Edge, either as a Visual only belt, or as a Playable belt with new locations. Moves objects out of the way of the belt either way.
kry-maraxsis-outer-planet=Moves Maraxsis from the inner planets, to the outer planets, matching its difficulty level next to Aquilo.
kry-maraxsis-solar-nerf=Nerfs solar power on Maraxsis from 75% to 50% to match its updated location near Aquilo (1% for comparison), for difficulty or realism.\nThis setting requires Maraxsis as Outer Planet to be enabled.
kry-cubium-outer-planet=Moves Cubium from the inner planets, to the outer planets, for balancing purposes.
kry-cubium-vesta-moon=Attaches Cubium to Vesta as a moon. Uses orbital links instead of a direct route, if Orbital Catapult is enabled.

[string-mod-setting-description]
kry-asteroid-belt-name-Kepler=Named after the first recorded scientist to theorize the existence of an asteroid belt in our solar system, between Mars and Jupiter.
kry-kuiper-belt-name-Kuiper=Named after one of the first scientists to theorize the existence of a region of icy bodies, located beyond the orbit of Neptune.
kry-asteroid-belt-name-Klothon=Named after one of the three fates from Greek mythology; the Spinner, who spins the thread of life.
kry-kuiper-belt-name-Atropon=Named after one of the three fates from Greek mythology; the Inevitable, who cuts the thread of life.
kry-asteroid-belt-name-Kovarex=Named after the guy who first started the Factorio project. He might also have a nuclear process named after him.
kry-kuiper-belt-name-Kryzeth=Why would you ever willingly select this option? Named after the guy who coded this, if you must know.

