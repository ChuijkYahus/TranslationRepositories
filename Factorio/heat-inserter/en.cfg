heat-description=Unlocks __1__ variants that use heat as their power source.

[mod-setting-name]
heat-inserter-min-interval=Minimum ticks between updates
heat-inserter-max-updates=Maximum updates per tick

[mod-setting-description]
heat-inserter-min-interval=Minimum number of ticks between temperature updates for each heat inserter. Defaults to 20 ticks between updates.\nLower values increases responsiveness, at the cost of increased time usage. This effect is negligible once you hit the cap of maximum updates per tick.
heat-inserter-max-updates=Maximum number of heat inserters updated per tick. Defaults to 10 inserters updated per tick.\nHigher values increase responsiveness, at the cost of increased time usage.