heat-inserter-max-updates=每刻最大更新数

[mod-setting-description]
heat-inserter-min-interval=各个热能机械臂每次更新温度之间最小需经历的刻数。默认间隔20刻。\n值越小，响应速度越快，但耗时也更高。达到每刻更新数上限后该效应的影响会减弱至可被忽略。
heat-inserter-max-updates=每刻最多能更新的热能机械臂数。默认每刻更新10个机械臂。\n值越大，响应速度越快，但耗时也更高。