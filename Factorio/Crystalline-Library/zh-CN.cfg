[mod-name]
Crystalline-Library=○🌐晶质库 [Crystalline Library]

[mod-description]
Crystalline-Library=○🌐包含伏卤星和北冥星共用资产与代码的内部库。

[mod-setting-name]
paracelsin-muria-aqua-regia=启用王水和修改过的铅/锌精炼配方。

[mod-setting-description]
paracelsin-muria-aqua-regia=此设置仅在同时启用伏卤星和北冥星时可用。它会启用王水，并将铅精炼和锌精炼合并为一个科技，同时调整精炼配方以提高难度，把两颗星球更紧密地联系在一起。

[technology-name]
vaterite-processing=球霰石处理
vaterite-processing-productivity=球霰石处理增产计划
zinc-and-lead-refining=锌与铅的精炼
fluorite-processing=萤石处理
fluorinated-uranium-processing=加氟铀矿处理
petroleum-gas-alkylation=石油气烷基化

[technology-description]
vaterite-processing=分离[item=vaterite]的各成分。
vaterite-processing-productivity=增加[recipe=vaterite-processing]的产出量。
zinc-and-lead-refining=伏卤星和北冥星科技的结晶——王水，由[fluid=hydrogen-chloride]与[fluid=nitric-acid]组成的、腐蚀性极强的溶液。这种溶液可以用到提升铅和锌品质的高等配方中去。
fluorite-processing=提取[item=fluorite]的各成分。
fluorinated-uranium-processing=使用[fluid=fluorine]增加铀矿处理的产出量。
petroleum-gas-alkylation=先进的石化加工工艺，能将[fluid=petroleum-gas]转化为[fluid=heavy-oil]。

