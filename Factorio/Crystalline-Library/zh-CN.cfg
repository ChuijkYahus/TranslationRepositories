[recipe-description]
vaterite-processing=在[fluid=water]中处理大量的[item=vaterite]以获取[item=carbon]和[item=calcite]。
fluorite-processing=在[fluid=sulfuric-acid]中处理[item=fluorite]以获取[fluid=hydrogen-fluoride]。
uranium-fluorination=使用[fluid=fluorine]将[item=uranium-ore]加工为[fluid=uranium-hexafluoride]。
uranium-hexafluoride-centrifuging=离心处理[fluid=uranium-hexafluoride]以分离各个铀同位素。
hydrogen-fluoride-electrolysis=分离[fluid=hydrogen-fluoride]的各成分。
petroleum-gas-alkylation=使用[fluid=hydrogen-fluoride]和[fluid=light-oil]作为催化剂，将[fluid=petroleum-gas]烷基化为[fluid=heavy-oil]。