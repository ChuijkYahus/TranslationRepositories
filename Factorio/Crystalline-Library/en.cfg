[recipe-description]
vaterite-processing=Obtain [item=carbon] and [item=calcite] by processing large amounts of [item=vaterite] in [fluid=water].
fluorite-processing=Obtain [fluid=hydrogen-fluoride] by processing [item=fluorite] in [fluid=sulfuric-acid].
uranium-fluorination=Use [fluid=fluorine] to turn [item=uranium-ore] into [fluid=uranium-hexafluoride].
uranium-hexafluoride-centrifuging=Centrifuge the [fluid=uranium-hexafluoride] to separate the uranium isotopes.
hydrogen-fluoride-electrolysis=Separate the components of [fluid=hydrogen-fluoride].
petroleum-gas-alkylation=Alkylate [fluid=petroleum-gas] into [fluid=heavy-oil] by using [fluid=hydrogen-fluoride] and [fluid=light-oil] as catalysts.