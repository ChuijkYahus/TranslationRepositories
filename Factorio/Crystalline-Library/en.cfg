[mod-name]
Crystalline-Library=○🌐Crystalline Library

[mod-description]
Crystalline-Library=○🌐Internal library for shared assets and code for Muria and Paracelsin.

[mod-setting-name]
paracelsin-muria-aqua-regia=Enable aqua regia and the modified lead/zinc refining recipes.

[mod-setting-description]
paracelsin-muria-aqua-regia=This setting only exists when both Muria and Paracelsin are active and it enables the existance of aqua regia and the merging of the lead and zinc refining technologies into one tech, alongside modifying the refining recipes to make them more challenging, bringing Muria and Paracelsin closer together.

