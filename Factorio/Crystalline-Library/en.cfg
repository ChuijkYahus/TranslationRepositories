zinc-and-lead-refining=Zinc and lead refining
fluorite-processing=Fluorite processing
fluorinated-uranium-processing=Fluorinated uranium processing
petroleum-gas-alkylation=Petroleum gas alkylation

[technology-description]
vaterite-processing=Separate the components of [item=vaterite].
vaterite-processing-productivity=Increased yield from [recipe=vaterite-processing].
zinc-and-lead-refining=By utilizing Murian and Paracelsian technologies, we can craft aqua regia, an extremely corrosive solution of [fluid=hydrogen-chloride] and [fluid=nitric-acid]. Utilizing this solution we can make use of advanced recipes to increase the quality of zinc and lead.
fluorite-processing=Extract the contents of [item=fluorite].
fluorinated-uranium-processing=Use [fluid=fluorine] to increase the yield from uranium processing.
petroleum-gas-alkylation=Advanced petrochemical process that allows turning [fluid=petroleum-gas] into [fluid=heavy-oil].

